<meta name="apple-mobile-web-app-title" content="Pikmin 花名冊">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#E8F5E9">
<style>
*{box-sizing:border-box}
body{margin:0;background:#F0F7F0;font-family:-apple-system,BlinkMacSystemFont,"PingFang HK","PingFang TC","Microsoft JhengHei",sans-serif;color:#1F2A1F}
.top{position:sticky;top:0;z-index:20;background:#E8F5E9;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 12px;border-bottom:1px solid #D5E9D5}
.top-in{max-width:560px;margin:0 auto;display:flex;gap:12px;align-items:center}
.top-in img{width:52px;height:52px;border-radius:14px;box-shadow:0 4px 12px rgba(0,0,0,.12)}
.top h1{margin:0;font-size:22px;line-height:1.1;letter-spacing:.5px}
.top p{margin:3px 0 0;font-size:13px;color:#4a7a4a}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 100px}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.stat{background:#fff;border:1px solid #E3EDE3;border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px;line-height:1}
.stat span{font-size:12px;color:#6B7A6B}
.addcard{background:#fff;border:1px solid #E3EDE3;border-radius:16px;padding:14px;box-shadow:0 2px 10px rgba(60,90,60,.06)}
.addcard h2{margin:0 0 10px;font-size:15px}
input,select{width:100%;padding:11px 12px;border:1.2px solid #DCE8DC;border-radius:11px;font-size:14px;background:#FBFFFb;outline:none}
input:focus,select:focus{border-color:#4CAF50;background:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px}
.addbtn{margin-top:10px;width:100%;border:0;border-radius:999px;background:#2E7D32;color:#fff;padding:12px;font-size:15px;font-weight:800;cursor:pointer}
.search{margin:14px 0 10px;position:relative}
.search input{padding-left:36px;border-radius:999px;background:#fff}
.search i{position:absolute;left:12px;top:11px;font-style:normal}
.colorbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.colorpill{border:1px solid #E3EDE3;background:#fff;border-radius:999px;padding:7px 10px;font-size:13px;font-weight:700;cursor:pointer;display:flex;gap:6px;align-items:center}
.colorpill.on{background:#1F2A1F;color:#fff;border-color:#1F2A1F}
.colorpill .dot{width:12px;height:12px;border-radius:50%;border:1px solid #00000020}
.statusbar{display:flex;gap:6px;margin-bottom:12px}
.statusbar button{flex:1;border:1px solid #E3EDE3;background:#fff;border-radius:999px;padding:9px;font-size:13px;font-weight:700;cursor:pointer}
.statusbar button.on{background:#E8F5E9;border-color:#4CAF50;color:#1B5E20}
.count{font-size:13px;color:#6B7A6B;text-align:right;margin:-6px 0 8px}
.item{background:#fff;border:1px solid #E9EFE9;border-radius:14px;padding:10px 12px;display:flex;gap:10px;align-items:center;margin-bottom:8px;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.item .bigdot{width:36px;height:36px;border-radius:50%;flex:0 0 36px;display:flex;align-items:center;justify-content:center;font-size:16px;border:1.5px solid #00000012}
.item .txt{flex:1;min-width:0}
.item .nm{font-weight:800;font-size:16px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .mt{font-size:12px;color:#6B7A6B;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .mt b{color:#3A4A3A;font-weight:600}
.pill{flex:0 0 auto;border:0;border-radius:999px;padding:8px 12px;font-size:12px;font-weight:800;cursor:pointer}
.pill.raising{background:#DBEAFE;color:#1E40AF}
.pill.done{background:#FCE7F3;color:#9D174D}
.del{border:0;background:#FFF1F1;border-radius:50%;width:32px;height:32px;font-size:14px;cursor:pointer;flex:0 0 32px}
.foot{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.foot button{border:1px solid #E3EDE3;background:#fff;border-radius:999px;padding:10px;font-size:13px;font-weight:700;cursor:pointer}
.note{margin-top:14px;text-align:center;font-size:12px;color:#8AA08A;line-height:1.5}
.empty{background:#fff;border:1px dashed #C8DCC8;border-radius:14px;padding:22px;text-align:center;color:#8AA08A;font-size:14px}
</style>
</head>

<div class="wrap">
<div class="stats"><div class="stat"><b id="sTotal">0</b><span>總數</span></div><div class="stat"><b id="sRaising" style="color:#2563EB">0</b><span>養緊</span></div><div class="stat"><b id="sDone" style="color:#DB2777">0</b><span>已成形</span></div></div>
<div class="addcard">
<input id="name" placeholder="Pikmin名，例如 紅01">
<div class="grid3"><select id="color"><option value="紅色">🔴 紅色</option><option value="黃色">🟡 黃色</option><option value="藍色">🔵 藍色</option><option value="紫色">🟣 紫色</option><option value="白色">⚪ 白色</option><option value="粉紅色">🌸 粉紅色</option><option value="岩石">🪨 岩石</option><option value="冰凍">🧊 冰凍</option></select><input id="cat" placeholder="分類，例如 餐廳"><input id="decor" placeholder="飾物，例如 廚師帽"></div>
<button class="addbtn" onclick="addItem()">+ 加入花名冊</button></div>
<div class="search"><i>🔍</i><input id="q" placeholder="搜尋 名字 / 分類 / 飾物..." oninput="render()"></div>
<div class="colorbar" id="colorFilters"></div>
<div class="statusbar"><button class="on" data-s="全部" onclick="setStatus(this)">全部</button><button data-s="養緊" onclick="setStatus(this)">養緊</button><button data-s="已成形" onclick="setStatus(this)">已成形</button></div>
<div class="count" id="count"></div>
<div id="list"></div>
<div class="foot"><button onclick="exportJSON()">⬇ 匯出 JSON</button><button onclick="document.getElementById('file').click()">⬆ 匯入 JSON</button><button onclick="if(confirm('清空全部？')){localStorage.removeItem(KEY);items=[];render()}">🗑 清空全部</button></div>
<input type="file" id="file" accept=".json,application/json" style="display:none" onchange="importJSON(event)">
<p class="note">獨立 .html 檔 · 唔使上網 · 資料只儲喺呢部機<br>加去主畫面：Safari 開呢個檔 → 分享 → 加入主畫面，個 icon 會自動係三隻花苗小精靈</p>
</div>
<script>
const KEY='pikmin_flower_roster_v2_fullnames';
let items=JSON.parse(localStorage.getItem(KEY)||'[]');
let colorFilter='全部', statusFilter='全部';
const COLORS={'紅色':{bg:'#FEE2E2',dot:'#EF4444',emoji:'🔴'},'黃色':{bg:'#FEF9C3',dot:'#EAB308',emoji:'🟡'},'藍色':{bg:'#DBEAFE',dot:'#3B82F6',emoji:'🔵'},'紫色':{bg:'#F3E8FF',dot:'#A855F7',emoji:'🟣'},'白色':{bg:'#F8FAFC',dot:'#E2E8F0',emoji:'⚪'},'粉紅色':{bg:'#FCE7F3',dot:'#F472B6',emoji:'🌸'},'岩石':{bg:'#E7E5E4',dot:'#78716C',emoji:'🪨'},'冰凍':{bg:'#CFFAFE',dot:'#22D3EE',emoji:'🧊'}};
function save(){localStorage.setItem(KEY,JSON.stringify(items))}
function addItem(){const n=document.getElementById('name').value.trim();if(!n)return alert('請輸入 Pikmin名');items.unshift({id:Date.now(),name:n,color:document.getElementById('color').value,cat:document.getElementById('cat').value.trim(),decor:document.getElementById('decor').value.trim(),status:'養緊'});document.getElementById('name').value='';save();render()}
function setStatus(b){document.querySelectorAll('[data-s]').forEach(x=>x.classList.remove('on'));b.classList.add('on');statusFilter=b.dataset.s;render()}
function renderFilters(){const c=document.getElementById('colorFilters');const keys=['全部'].concat(Object.keys(COLORS));c.innerHTML=keys.map(k=>{if(k==='全部')return '<button class="colorpill '+(colorFilter==='全部'?'on':'')+'" onclick="colorFilter=\'全部\';renderFilters();render()">🌿 全部</button>';const cnt=items.filter(x=>x.color===k).length;const col=COLORS[k];return '<button class="colorpill '+(colorFilter===k?'on':'')+'" onclick="colorFilter=\''+k+'\';renderFilters();render()"><span class="dot" style="background:'+col.dot+'"></span>'+k+' '+cnt+'隻</button>'}).join('')}
function render(){const q=document.getElementById('q').value.trim();const f=items.filter(it=>(colorFilter==='全部'||it.color===colorFilter)&&(statusFilter==='全部'||it.status===statusFilter)&&(!q||(it.name+it.cat+it.decor).includes(q)));document.getElementById('sTotal').textContent=items.length;document.getElementById('sRaising').textContent=items.filter(x=>x.status==='養緊').length;document.getElementById('sDone').textContent=items.filter(x=>x.status==='已成形').length;document.getElementById('count').textContent='顯示 '+f.length+' / 共 '+items.length+' 隻';const list=document.getElementById('list');if(!f.length){list.innerHTML='<div class="empty">🌱 未有記錄<br>上面啦</div>';return}list.innerHTML=f.map(it=>{const col=COLORS[it.color]||COLORS['紅色'];return '<div class="item"><span class="bigdot" style="background:'+col.bg+'">'+col.emoji+'</span><div class="txt"><div class="nm">'+it.name+'</div><div class="mt"><b>'+it.color+'</b> · '+(it.cat||'未分類')+' · '+(it.decor||'未填飾物')+'</div></div><button class="pill '+(it.status==='養緊'?'raising':'done')+'" onclick="toggle('+it.id+')">'+it.status+'</button><button class="del" onclick="del('+it.id+')">🗑️</button></div>'}).join('')}
function toggle(id){const it=items.find(x=>x.id===id);if(it){it.status=it.status==='養緊'?'已成形':'養緊';save();render()}}
function del(id){if(!confirm('刪除呢隻？'))return;items=items.filter(x=>x.id!==id);save();render()}
function exportJSON(){const blob=new Blob([JSON.stringify(items,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='pikmin-flower-roster.json';a.click()}
function importJSON(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(Array.isArray(d)){items=d;save();renderFilters();render()}}catch(err){alert('JSON 格式唔啱')}};r.readAsText(f)}
renderFilters();render();
</script>
</body>
